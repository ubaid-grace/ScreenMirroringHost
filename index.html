<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <video id="player" autoplay playsinline></video>
  <script>
    const context  = cast.framework.CastReceiverContext.getInstance();
    const manager  = context.getPlayerManager();
    const video    = document.getElementById('player');

    manager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        const url = request.media?.contentId || request.media?.contentUrl;
        console.log('LOAD intercepted:', url);

        if (url && (url.includes('.m3u8') || url.includes('mpegurl'))) {
          if (Hls.isSupported()) {
            const hls = new Hls({
              enableWorker: false,
              lowLatencyMode: true,
              backBufferLength: 30
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              console.log('HLS manifest parsed, playing...');
              video.play();
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
              console.error('HLS error:', data.type, data.details);
            });
            // Tell the CAF framework to let us handle playback
            request.media.contentType = 'video/mp4';
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
          }
        }
        return request;
      }
    );

    context.start({ touchScreenOptimizedApp: false });
  </script>
</body>
</html>
